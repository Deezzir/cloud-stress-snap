[tox]
requires =
    tox==4.67.2
    tox-uv==1.37.1
    uv==0.12.21
env_list = format, lint, unit, func, typecheck

[testenv]
runner = uv-venv-lock-runner
base_python = python3.12
package = wheel
no_default_groups = true
uv_sync_locked = true

[testenv:format]
description = Apply source formatting
dependency_groups = format
commands = ruff format src

[testenv:lint]
description = Check lint and formatting without modifying source
dependency_groups = lint
commands =
    ruff check src
    ruff format --check src

[testenv:unit]
description = Run isolated unit coverage; missing tests/unit is an error
dependency_groups = unit
commands = python -m pytest tests/unit

[testenv:func]
description = Run functional coverage; missing tests/func is an error
dependency_groups = func
commands = python -m pytest tests/func

[testenv:typecheck]
description = Check static types
dependency_groups = typecheck
commands = mypy src

[testenv:lock]
description = Regenerate uv.lock after dependency changes
runner = uv-venv-runner
package = skip
deps = uv==0.12.21
commands = uv lock
