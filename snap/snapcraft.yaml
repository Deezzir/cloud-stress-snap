name: cloud-stress
base: core24
version: '0.1.0'
license: BSD-3-Clause
summary: Prodstack stress testing tool
grade: devel
confinement: strict
icon: snap/gui/icon.png
issues: https://github.com/Deezzir/cloud-stress-snap/issues
source-code: https://github.com/Deezzir/cloud-stress-snap
description: |
  Stress test a Prodstack cloud.

  cloud-stress checks that the cloud is ready, runs network and storage load
  against it, and reports the achieved load and how the cloud degraded.

  **How-To**

  How to connect your Juju and OpenStack credentials:

      sudo snap connect cloud-stress:dot-local-share-juju
      sudo snap connect cloud-stress:dot-config-openstack

  How to check a cloud (read-only):

      cloud-stress check --juju-model <model>

  How to start a run:

      cloud-stress run start --profile host-network --duration 30m --juju-model <model>

  How to follow, stop, or export a run:

      cloud-stress run status [<run-id>]
      cloud-stress run stop
      cloud-stress run status --json
      cloud-stress run status [<run-id>] --html report.html

  **Reference**

  Profiles:

  * `host-network`: UDP flood from one hypervisor to a guest on another.
  * `ceph-block`: fio sweep on a Ceph volume attached to a guest.
  * `network-ceph`: host-network and fio together.

  Requirements:

  * OpenStack credentials in `OS_*` variables or `clouds.yaml` (`--cloud`).
  * A Juju login with admin access to the OpenStack model.
  * Optional: MAAS URL (`--maas-url`) and API key (`MAAS_TOKEN`).
  * An overlay network with an IPv4 subnet for guest management.

  Placement is chosen automatically; override it with `--sender`, `--target`,
  `--network`, `--ip-version`, `--mgmt-network`, `--image`, `--flavor` and
  `--volume-type`.

  Results report measured SLO indicators without a verdict. Exit codes:
  `0` completed, `20` failed, interrupted or not cleaned up, `30` cancelled.

  Run results are stored in `/var/snap/cloud-stress/common/runs/`.

  **Security**

  https://github.com/Deezzir/cloud-stress-snap/blob/main/docs/security-reference.md

platforms:
  amd64:
  arm64:

plugs:
  shared-memory:
    private: true
  dot-config-openstack:
    interface: personal-files
    read:
      - $HOME/.config/openstack
  dot-local-share-juju:
    interface: personal-files
    write:
      - $HOME/.local/share/juju
  etc-openstack:
    interface: system-files
    read:
      - /etc/openstack

apps:
  cloud-stress:
    command: bin/cloud-stress
    environment:
      JUJU_DATA: $SNAP_REAL_HOME/.local/share/juju
    plugs:
      - network
      - home
      - shared-memory
      - dot-local-share-juju
      - dot-config-openstack
      - etc-openstack
  worker:
    command: bin/cloud-stress-worker
    daemon: simple
    restart-condition: on-failure
    sockets:
      control:
        listen-stream: $SNAP_COMMON/control.sock
        socket-mode: 0666
    plugs:
      - network
      - network-bind
  recover:
    command: bin/cloud-stress-worker recover
    daemon: oneshot
    plugs:
      - network

parts:
  juju-client:
    plugin: nil
    stage-snaps:
      - juju/3.6/stable
    stage:
      - bin/juju
  remote-access:
    plugin: nil
    stage-packages:
      - ca-certificates
      - openssh-client
  cloud-stress:
    after:
      - juju-client
      - remote-access
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    override-build: |
      # Frozen sync alone does not check whether declarations match the lock.
      UV_FROZEN=false uv lock --check
      craftctl default
