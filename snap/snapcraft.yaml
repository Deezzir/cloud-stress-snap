name: cloud-stress
base: core24
version: '0.1.0'
license: BSD-3-Clause
summary: Prodstack stress testing tool
grade: stable
confinement: strict
icon: snap/gui/icon.png
issues: https://github.com/Deezzir/cloud-stress-snap/issues
source-code: https://github.com/Deezzir/cloud-stress-snap
description: |
  Stress test a Prodstack cloud.

  cloud-stress checks that the cloud is ready, runs TRex network traffic and fio
  storage load on a fleet of VMs, and reports time-series measurements of the
  workloads, hosts and Ceph.

  **How-To**

  How to connect your Juju credentials:

      sudo snap connect cloud-stress:dot-local-share-juju

  How to check a cloud (read-only):

      cloud-stress check

  How to start a run from the example configuration:

      cp /snap/cloud-stress/current/share/cloud-stress/config.yaml ~/stress.yaml
      cloud-stress run start --config ~/stress.yaml

  How to follow, stop, or export a run:

      cloud-stress run status [<run-id>]
      cloud-stress run stop
      cloud-stress run status --json
      cloud-stress run status [<run-id>] --html report.html

  **Reference**

  Workloads, enabled by sections of the run configuration:

  * `trex`: UDP traffic between guests, fanned in to or out of one hypervisor.
  * `fio`: fio on a Ceph-backed Cinder volume attached to every guest.

  Requirements:

  * OpenStack credentials in `OS_*` variables, or a single-cloud `clouds.yaml` in the current directory or at `OS_CLIENT_CONFIG_FILE` under your home (`OS_CLOUD` selects one of several).
  * A Juju login with admin access to the OpenStack model.
  * Optional: a MAAS cloud credential on the Juju model, read for MAAS records.
  * An overlay network with an IPv4 subnet for guest management.

  The configuration file, kept in your home directory, sets the workloads, VM
  placement and duration. Networks, images, flavor and volume type are chosen
  automatically; override them with `--provider-network`, `--ip-version`,
  `--network`, `--image`, `--flavor` and `--volume-type`.
  Configuration reference:
  https://github.com/Deezzir/cloud-stress-snap/blob/main/docs/configuration.md

  Results include measurements, graphs and raw tool output.
  Exit codes:
  `0` completed, `20` failed, interrupted or not cleaned up, `30` cancelled.

  Run results are stored in `/var/snap/cloud-stress/common/runs/`.

  **Security**

  https://github.com/Deezzir/cloud-stress-snap/blob/main/docs/security-reference.md

platforms:
  amd64:
  arm64:

plugs:
  shared-memory:
    private: true
  dot-local-share-juju:
    interface: personal-files
    write:
      - $HOME/.local/share/juju

apps:
  cloud-stress:
    command: bin/cloud-stress
    environment:
      JUJU_DATA: $SNAP_REAL_HOME/.local/share/juju
    plugs:
      - network
      - home
      - shared-memory
      - dot-local-share-juju
  worker:
    command: bin/cloud-stress-worker
    daemon: simple
    restart-condition: on-failure
    sockets:
      control:
        listen-stream: $SNAP_COMMON/control.sock
        socket-mode: 0666
    plugs:
      - network
      - network-bind
  recover:
    command: bin/cloud-stress-worker recover
    daemon: oneshot
    plugs:
      - network

parts:
  juju-client:
    plugin: nil
    stage-snaps:
      - juju/3.6/stable
    stage:
      - bin/juju
  remote-access:
    plugin: nil
    stage-packages:
      - ca-certificates
      - openssh-client
  cloud-stress:
    after:
      - juju-client
      - remote-access
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    override-build: |
      # Frozen sync alone does not check whether declarations match the lock.
      UV_FROZEN=false uv lock --check
      craftctl default
      install -D -m 0644 config.yaml \
        "$CRAFT_PART_INSTALL/share/cloud-stress/config.yaml"
