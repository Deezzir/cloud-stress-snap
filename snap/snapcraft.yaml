name: cloud-stress
base: core24
version: '0.1.0'
license: BSD-3-Clause
summary: Prodstack stress testing tool
grade: devel
confinement: strict
icon: snap/gui/icon.png
issues: https://github.com/Deezzir/prodstack-stress-test/issues
source-code: https://github.com/Deezzir/prodstack-stress-test
description: |
  Stress test Prodstack infrastructure with coordinated network, storage, and
  compute workloads. Measure performance under load, identify shared-resource
  bottlenecks, and evaluate isolation and QoS before production. Collect metrics
  and generate a report of achieved load and degradation for each run.

platforms:
  amd64:
  arm64:

plugs:
  shared-memory:
    private: true
  dot-config-openstack:
    interface: personal-files
    read:
      - $HOME/.config/openstack
  dot-local-share-juju:
    interface: personal-files
    write:
      - $HOME/.local/share/juju
  etc-openstack:
    interface: system-files
    read:
      - /etc/openstack

apps:
  cloud-stress:
    command: bin/cloud-stress
    environment:
      JUJU_DATA: $SNAP_REAL_HOME/.local/share/juju
    plugs:
      - network
      - home
      - shared-memory
      - dot-local-share-juju
      - dot-config-openstack
      - etc-openstack

parts:
  juju-client:
    plugin: nil
    stage-snaps:
      - juju/3.6/stable
    stage:
      - bin/juju
  remote-access:
    plugin: nil
    stage-packages:
      - ca-certificates
  cloud-stress:
    after:
      - juju-client
      - remote-access
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    override-build: |
      # Frozen sync alone does not check whether declarations match the lock.
      UV_FROZEN=false uv lock --check
      craftctl default
